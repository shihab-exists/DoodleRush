<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Doodle Rush: Dimensions Above</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <canvas id="canvas" width="422" height="552"></canvas>
    <img id="sprite" src="https://i.imgur.com/2WEhF.png" alt="">

    <!-- HUD -->
    <div id="hud">
      <div><span id="hudScore">⭐ 0</span></div>
      <div>
        <span id="hudCoins" class="hl">🪙 0</span>
        <span id="hudShield" class="hl" style="display:none">🛡️</span>
      </div>
    </div>

    <!-- Mobile Buttons -->
    <div id="mobL">◀</div>
    <div id="mobR">▶</div>

    <!-- UI Screens -->
    <div id="ui">
      <!-- Menu -->
      <div id="menuScreen" class="show">
        <div class="panel">
          <h1 class="title">Doodle Rush</h1>
          <h2>Dimensions Above</h2>
          <p id="menuBest">Best: 0 · 🪙 0</p>
          <button class="gbtn" onclick="startGame()">▶️ Play</button><br>
          <button class="gbtn sm" onclick="showScreen('skinScreen')">🎨 Skins</button>
          <button class="gbtn sm" onclick="showScreen('missionScreen')">📋 Missions</button>
          <button class="gbtn sm" onclick="showScreen('settingScreen')">⚙️ Settings</button>
        </div>
      </div>

      <!-- Skins -->
      <div id="skinScreen">
        <div class="panel">
          <h2>🎨 Skins</h2>
          <div class="row" id="skinList"></div>
          <p id="skinCoins" class="small"></p>
          <button class="gbtn sm gray" onclick="showScreen('menuScreen')">← Back</button>
        </div>
        

      <!-- Missions -->
      <div id="missionScreen">
        <div class="panel scrollable">
          <h2>📋 Daily Missions</h2>
          <p class="small" id="mDate"></p>
          <div id="missionList"></div>
          <button class="gbtn sm gray" onclick="showScreen('menuScreen')">← Back</button>
        </div>
      </div>

      <!-- Settings -->
      <div id="settingScreen">
        <div class="panel">
          <h2>⚙️ Settings</h2>
          <div class="srow">Sound <div class="toggle on" id="togSfx" onclick="togSet('sfx',this)"></div></div>
          <div class="srow">Music <div class="toggle on" id="togMusic" onclick="togSet('music',this)"></div></div>
          <div class="srow">Tilt 📱 <div class="toggle" id="togTilt" onclick="togSet('tilt',this)"></div></div>
          <div class="setting-group">
            <span>Difficulty</span>
            <div class="diff-row">
              <button class="diff-btn" onclick="setDiff('easy',this)">Easy</button>
              <button class="diff-btn sel" onclick="setDiff('normal',this)">Normal</button>
              <button class="diff-btn" onclick="setDiff('hard',this)">Hard</button>
            </div>
          </div>
          <p class="small">← → or A/D move · Space restart</p>
          <button class="gbtn sm gray" onclick="showScreen('menuScreen')">← Back</button>
        </div>
      </div>

      <!-- Game Over -->
      <div id="overScreen">
        <div class="panel">
          <h1 class="go-title">Game Over!</h1>
          <p id="overScore" class="go-score"></p>
          <p id="overBest" class="go-best"></p>
          <p id="overStats" class="small"></p>
          <button class="gbtn" onclick="startGame()">🔄 Play Again</button>
          <button class="gbtn sm gray" onclick="showScreen('menuScreen')">🏠 Menu</button>
        </div>
      </div>
    </div>
  </div>

  <!-- JS Modules -->
  <script src="js/storage.js"></script>
  <script src="js/config.js"></script>
  <script src="js/missions.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/objects.js"></script>
  <script src="js/game.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
